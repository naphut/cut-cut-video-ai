name: Build Windows Installer (CapCut Style)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Video_AI_Setup_v1.0.exe
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🛠️ Install Inno Setup & FFmpeg via Chocolatey
        run: |
          choco install innosetup -y
          choco install ffmpeg -y

      - name: 📦 Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: 🚚 Prepare Bundled FFmpeg Binaries
        shell: pwsh
        run: |
          $ffmpegPath = (Get-Command ffmpeg.exe).Source
          $ffprobePath = (Get-Command ffprobe.exe).Source
          Copy-Item $ffmpegPath -Destination .
          Copy-Item $ffprobePath -Destination .
          Write-Host "✅ Copied ffmpeg.exe and ffprobe.exe to build directory"

      - name: 🔨 Compile Video AI into Closed-Source Executable (PyInstaller)
        run: |
          python build_windows_exe.py

      - name: 🏭 Build Inno Setup Installer (Video_AI_Setup_v1.0.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_config.iss

      - name: 📤 Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video_AI_Setup_v1.0
          path: Output/Video_AI_Setup_v1.0.exe
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish GitHub Release (if on main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Video AI Studio v1.0.0 (Windows Installer)"
          body: |
            ## 🎬 Video AI Studio v1.0.0
            - 100% Closed-source standalone Windows Installer.
            - Professional setup wizard like CapCut.
            - Bundled with Khmer Fonts, FFmpeg, and AI Voice Engine.
            - Zero-setup installation for all Windows users.
          files: Output/Video_AI_Setup_v1.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
